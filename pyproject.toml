[project]
name = "taxdeed"
version = "0.1.0"
description = "Find and screen tax deed auction parcels for buildability and value."
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "openpyxl>=3.1"]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
taxdeed = "taxdeed.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
taxdeed = ["static/*"]

[tool.setuptools.packages.find]
include = ["taxdeed*"]
