# Copy to config.yaml and adjust. Anything you leave out uses the defaults
# in taxdeed/config.py.

buildable:
  min_lot_acres: 0.17          # check the county's minimum lot size for your zoning
  min_lot_width_ft: 50
  max_slope_pct: 15            # above ~15% site work gets expensive
  allow_sfha: false            # FEMA A/V flood zones
  allow_wetlands: false
  require_road_frontage: true
  allowed_zoning: []           # e.g. ["R-1", "R-2", "RS-6", "A-1"]

value:
  closing_costs: 1500
  quiet_title_cost: 2500       # varies a lot by state; ask a local attorney
  assessed_to_market_ratio: 1.0
  max_bid_to_value: 0.6

# Houses to renovate. Set cost_per_sqft to what YOUR contractors charge.
rehab:
  cost_per_sqft: {light: 20, medium: 40, heavy: 70, gut: 120}
  fixed_costs: 5000            # cleanout, locks, permits, utilities
  contingency_pct: 15          # you usually can't see inside before a tax sale
  max_tier: medium             # light = cosmetic; medium = + kitchen/baths; heavy = + roof/systems
  max_rehab_cost: 60000
  eviction_cost: 3500
  arv_factor: 0.70             # 70% rule
  holding_months: 6
  holding_cost_per_month: 800
  selling_cost_pct: 8
  min_profit: 20000
  # Your county's condition codes -> scope, if it doesn't use words like Good/Fair/Poor:
  condition_map: {}            # e.g. {"c1": light, "c2": light, "c3": medium, "c4": heavy, "c5": gut}
